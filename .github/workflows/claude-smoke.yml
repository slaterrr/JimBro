# Live Claude smoke test for server/jim-proxy, using the repository secret CLAUD_TOKEN.
# The key stays in GitHub: it is passed as ANTHROPIC_API_KEY to this job only, and Actions masks it
# in logs. It makes ONE real call (a plain reply) and prints PASS/FAIL; it never prints the key or
# request bodies. Run all three checks locally with `npm run smoke`.
name: Claude smoke test

on:
  workflow_dispatch:
  push:
    branches: [feat/engines]
    paths:
      - '.github/workflows/claude-smoke.yml'

permissions:
  contents: read

concurrency:
  group: claude-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install proxy dependencies
        working-directory: server/jim-proxy
        run: npm ci
      - name: Proxy unit tests (Claude mocked)
        working-directory: server/jim-proxy
        run: npm test
      - name: Live check (real Claude calls)
        working-directory: server/jim-proxy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUD_TOKEN }}
          # One plain call by default; a commit message containing [smoke:read+write] runs the
          # history-lookup and proposal checks instead.
          CHECKS: ${{ contains(github.event.head_commit.message, '[smoke:read+write]') && '--checks=read,write' || '--one' }}
        run: npm run smoke -- $CHECKS
