name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff formatting
        run: ruff format --check backend
      - name: Strict types
        run: mypy backend/jimbro
      - name: Unit + API tests (coverage gate)
        run: pytest --cov=backend/jimbro --cov-report=term-missing --cov-fail-under=90

  mobile-quality:
    name: mobile-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit + component tests
        run: npm test
      - name: Production build
        run: npx vite build

  expo-quality:
    name: expo-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/expo/package-lock.json
      - run: npm ci
      - name: Engine + helper tests
        run: npm test
      - name: Vision regression (simulator sweeps + real-clip landmarks)
        working-directory: tools/vision-lab
        run: npm ci && npm test
      - name: AI proxy tests (SDK mocked)
        working-directory: server/jim-proxy
        run: npm ci && npm test
      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir /tmp/expo-dist

  # Playwright exercises chat, camera replay, inline tools and confirmation persistence
  # through the production HTTP boundary with an injected SDK (no API key required).
  ui-smoke:
    name: ui-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/expo/package-lock.json
      - run: npm ci
      - name: Chat E2E (web export + Playwright + production HTTP)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_OUT: e2e-artifacts
        run: npm run test:ui
      - name: User journeys (Playwright, same web export)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CI: "true"
        run: npm run test:e2e:only
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: apps/expo/e2e-artifacts
          retention-days: 14

  publish-preview:
    name: Publish shared Expo preview
    needs: [backend-quality, mobile-quality, expo-quality, ui-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/expo/package-lock.json
      - name: Require publishing credential
        env:
          EXPO_TOKEN: ${{ secrets.expo_access_token }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Add expo_access_token in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.expo_access_token }}
      - run: npm ci
      - name: Publish tested main commit
        run: eas update --channel preview --environment preview --message "main $GITHUB_SHA" --non-interactive
      - name: Link shared preview
        run: echo 'https://expo.dev/accounts/slaterr/projects/jimbro/branches/preview' >> "$GITHUB_STEP_SUMMARY"
