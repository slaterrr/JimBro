name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff formatting
        run: ruff format --check backend
      - name: Strict types
        run: mypy backend/jimbro
      - name: Unit + API tests (coverage gate)
        run: pytest --cov=backend/jimbro --cov-report=term-missing --cov-fail-under=90
